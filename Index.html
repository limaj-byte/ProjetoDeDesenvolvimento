<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na sua conta da TechNova Store.">
    <title>Entrar | TechNova Store</title>
    <link rel="stylesheet" href="/Styles/style.css">
</head>
<body>
    <header>
        <a href="homepage.html" aria-label="TechNova Store - página inicial">TechNova Store</a>
        <h1>Entrar na minha conta</h1>
    </header>

    <main>
        <section aria-labelledby="titulo-login">
            <h2 id="titulo-login">Acesse sua conta</h2>
            <form id="form-login" action="#" method="post">
                <p>
                    <label for="login-email">E-mail</label><br>
                    <input type="email" id="login-email" name="email" autocomplete="email"
                        placeholder="voce@exemplo.com" required>
                </p>
                <p>
                    <label for="login-senha">Senha</label><br>
                    <input type="password" id="login-senha" name="senha" autocomplete="current-password"
                        minlength="8" required>
                </p>
                <p>
                    <input type="checkbox" id="lembrar-login" name="lembrar-login">
                    <label for="lembrar-login">Manter conectado neste dispositivo</label>
                </p>
                <button type="submit">Entrar</button>
            </form>
        </section>

        <section aria-labelledby="titulo-cadastro">
            <h2 id="titulo-cadastro">Ainda não tem uma conta?</h2>
            <p><a href="cadastro.html">Criar uma conta</a></p>
        </section>
    </main>

    <footer>
        <p><a href="homepage.html">Voltar à página inicial</a></p>
        <p>TechNova Store - Ambiente de demonstração.</p>
    </footer>
</body>
</html>
